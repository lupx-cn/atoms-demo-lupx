# Render Blueprint：一键创建 Atoms-Demo Web Service
# 部署后需在 Render 控制台 Environment 手动填入 DEEPSEEK_API_KEY（sync: false）
services:
  - type: web
    name: atoms-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: LOG_LEVEL
        value: INFO